[project]
name = "braeburn"
version = "0.1.0"
description = "Harness for Braeburn, a persistent persona agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "jsonschema>=4.26.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
braeburn = "braeburn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/braeburn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
